<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>Anda sedang offline — medcal Tech</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #f1f5f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 24rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: auto;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.95rem;
        color: #475569;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0 16px;
      }
      button:active {
        background: #115e59;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/short-logo.png" alt="" />
      <h1>Anda sedang offline</h1>
      <p>Sambungkan kembali ke internet untuk memuat job Anda.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
