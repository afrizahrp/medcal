services:
  postgres:
    image: postgres:16-alpine
    container_name: medcal-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medcal
      POSTGRES_PASSWORD: medcal
      POSTGRES_DB: medcal
    volumes:
      - medcal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcal -d medcal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medcal_pg_data:
